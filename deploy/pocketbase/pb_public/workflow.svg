<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Campus 应用运行流程</title><desc id="desc">进入 Campus 后选择服务、课程或学生项目。课程数据经邮箱验证账号访问 PocketBase。提问经网关校验账号和资料归属后调用 ChatECNU。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9233c"/></marker></defs><rect width="1000" height="570" rx="12" fill="#fff"/>
<g fill="none" stroke="#a9233c" stroke-width="2" marker-end="url(#arrow)"><path d="M500 94V120H210V150"/><path d="M500 94V150"/><path d="M500 120H790V150"/><path d="M210 218V258"/><path d="M500 218V258"/><path d="M790 218V258"/><path d="M500 326V367"/><path d="M500 435V475"/></g><g stroke="#e6e1dc" fill="#faf8f5"><rect x="90" y="150" width="240" height="68" rx="12"/><rect x="380" y="150" width="240" height="68" rx="12"/><rect x="670" y="150" width="240" height="68" rx="12"/><rect x="90" y="258" width="240" height="68" rx="12"/><rect x="380" y="258" width="240" height="68" rx="12"/><rect x="670" y="258" width="240" height="68" rx="12"/><rect x="325" y="367" width="350" height="68" rx="12"/><rect x="325" y="475" width="350" height="68" rx="12"/></g><rect x="380" y="26" width="240" height="68" rx="12" fill="#a9233c"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif" text-anchor="middle" font-size="18" fill="#24252b"><text x="500" y="67" fill="white">进入 Campus</text><text x="210" y="178">校园服务</text><text x="500" y="178">个人课程空间</text><text x="790" y="178">学生项目发现</text><text x="210" y="287">打开外部网站 / 工具</text><text x="500" y="287">PocketBase 个人数据</text><text x="790" y="287">项目介绍 / 仓库链接</text><text x="500" y="396">选中资料 → 网关校验账号与归属</text><text x="500" y="504">ChatECNU → 返回课程问答</text></g><g font-family="system-ui,Microsoft YaHei,sans-serif" text-anchor="middle" font-size="13" fill="#656873"><text x="210" y="201">查找、分类、收藏</text><text x="500" y="201">邮箱注册 → 邮件验证 → 登录</text><text x="790" y="201">发现校园开发者的工具</text><text x="210" y="310">按原服务的要求登录</text><text x="500" y="310">课程、笔记、资料、学习记录</text><text x="790" y="310">代码协作交给原仓库平台</text><text x="500" y="419">客户端不接触模型 Key</text><text x="500" y="527">需模型服务配置就绪；答案仅供学习参考</text></g></svg>
