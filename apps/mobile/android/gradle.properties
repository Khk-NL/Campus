org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关掉 Kotlin 增量编译 / disable Kotlin incremental compilation
#
# 原因 / why: 在本机（Windows 11 + JDK 25）上，插件模块的 Kotlin 任务会以
# "Could not close incremental caches ... cacheable/caches-jvm/jvm/kotlin:
# class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab"
# 失败。堆栈落在 IntelliJ 的 PersistentHashMap（kotlin.incremental.storage）写缓存那一步，
# 也就是增量编译的持久化缓存层，而不是 Kotlin 编译器本身。
#
# On this machine (Windows 11 + JDK 25) the plugin modules' Kotlin tasks fail with
# "Could not close incremental caches ... caches-jvm/jvm/kotlin: ...". The stack lands in
# IntelliJ's PersistentHashMap (kotlin.incremental.storage) while writing the cache — i.e. the
# incremental compilation cache layer, not the Kotlin compiler itself.
#
# 代价是每次改 Kotlin 代码都要全量重编。对本项目影响很小：Flutter 应用自己的代码是
# Dart，Kotlin 只出现在插件模块里，且很少改动。
# The cost is a full recompile of Kotlin on each build. The impact here is small: the app's own
# code is Dart, and Kotlin only appears in plugin modules that change rarely.
#
# 如果将来换到 JDK 17/21 后这个问题消失，可以删掉这一行恢复增量编译。
# If the problem disappears under JDK 17/21 later, delete this line to restore incremental builds.
kotlin.incremental=false
