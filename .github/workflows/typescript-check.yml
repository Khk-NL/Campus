name: Campulse TypeScript checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-gateway/**'
      - 'adapters/**'
      - 'packages/**'
      - 'scripts/smoke/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/typescript-check.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/ai-gateway/**'
      - 'adapters/**'
      - 'packages/**'
      - 'scripts/smoke/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/typescript-check.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
